name: Deploy Najoom Al-Arab v2.6.4-r16

on:
  push:
    branches:
      - automation/export-baseline-r16

permissions:
  contents: write

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify exact patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patches/v2.6.4-r16.part0{1..5} > /tmp/v2.6.4-r16.patch.xz.b64
          base64 --decode /tmp/v2.6.4-r16.patch.xz.b64 > /tmp/v2.6.4-r16.patch.xz
          xz --decompress --stdout /tmp/v2.6.4-r16.patch.xz > /tmp/v2.6.4-r16.patch
          echo "c7ec87d370849f6b621b51faa98d2430ffdc2f2b9bed25471aba3c1dc1772c74  /tmp/v2.6.4-r16.patch" | sha256sum --check --strict

      - name: Apply release patch and verify uploaded file identity
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/v2.6.4-r16.patch
          git apply /tmp/v2.6.4-r16.patch
          test "$(wc -c < index.html)" = "7276592"
          echo "602acbd2e6377159e7f498480f3d3a62ff3eb44720aa68375364489d61012968  index.html" | sha256sum --check --strict
          grep -Fq '<meta content="2.6.4-r16" name="application-version"/>' index.html

      - name: Commit exact v2.6.4-r16 release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: publish Najoom Al-Arab v2.6.4-r16"
          git push origin HEAD:automation/export-baseline-r16
