name: Deploy Najoom Al-Arab v2.6.4-r16

on:
  pull_request:
    branches:
      - main
    types:
      - reopened

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Export suspect patch parts
        uses: actions/upload-artifact@v4
        with:
          name: suspect-patch-parts
          path: |
            .github/patches/v2.6.4-r16.part01
            .github/patches/v2.6.4-r16.part04
          compression-level: 0
          if-no-files-found: error

      - name: Reassemble and verify exact patch
        shell: bash
        run: |
          set -euo pipefail
          sha256sum .github/patches/v2.6.4-r16.part0{1..5}
          wc -c .github/patches/v2.6.4-r16.part0{1..5}
          cat > /tmp/expected-parts.sha256 <<'EOF'
          7d51fd85dd826f1596321b58c3a31f78a75e12fe92f152d2aa7c3a4e6d9d6295  .github/patches/v2.6.4-r16.part01
          b2de2301f17093a41a1203fe15e2501c8ed890fec49ff7fa6322c54cb64dd31b  .github/patches/v2.6.4-r16.part02
          2cc98f61d1772819025298d36a62f29a3d2170c9beb5eb5f5cd4258dc42fa66b  .github/patches/v2.6.4-r16.part03
          b97a469e8c0885421c52b8efecbe86830ed54312bfb46197ecb49420f032439c  .github/patches/v2.6.4-r16.part04
          b3d257bcd5210107715f43174462fcf27b89baef9c36a6584bc6be258414f406  .github/patches/v2.6.4-r16.part05
          EOF
          sha256sum --check --strict /tmp/expected-parts.sha256
          cat .github/patches/v2.6.4-r16.part0{1..5} > /tmp/v2.6.4-r16.patch.xz.b64
          base64 --decode /tmp/v2.6.4-r16.patch.xz.b64 > /tmp/v2.6.4-r16.patch.xz
          xz --decompress --stdout /tmp/v2.6.4-r16.patch.xz > /tmp/v2.6.4-r16.patch
          echo "c7ec87d370849f6b621b51faa98d2430ffdc2f2b9bed25471aba3c1dc1772c74  /tmp/v2.6.4-r16.patch" | sha256sum --check --strict

      - name: Apply release patch and verify uploaded file identity
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/v2.6.4-r16.patch
          git apply /tmp/v2.6.4-r16.patch
          test "$(wc -c < index.html)" = "7276592"
          echo "602acbd2e6377159e7f498480f3d3a62ff3eb44720aa68375364489d61012968  index.html" | sha256sum --check --strict
          grep -Fq '<meta content="2.6.4-r16" name="application-version"/>' index.html

      - name: Commit exact v2.6.4-r16 release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: publish Najoom Al-Arab v2.6.4-r16"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
