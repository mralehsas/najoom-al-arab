name: Najoom Anchor Map

on:
  push:
    paths:
      - '.github/workflows/najoom-anchor-map.yml'

permissions:
  contents: write

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Map target anchors to current index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          from collections import defaultdict
          old = Path('index.html').read_bytes().splitlines(keepends=True)
          pos = defaultdict(list)
          for i, line in enumerate(old, 1):
              pos[hashlib.sha256(line).hexdigest()].append(i)
          rows=[]
          for raw in Path('.najoom-new-anchors.tsv').read_text(encoding='utf-8').splitlines():
              if not raw.strip(): continue
              new_i, ln, h = raw.split('\t')
              hits = pos.get(h, [])
              rows.append(f"{new_i}\t{ln}\t{h}\t{','.join(map(str,hits))}")
          Path('.najoom-anchor-map.tsv').write_text('\n'.join(rows)+'\n', encoding='utf-8')
          PY
      - name: Commit anchor map
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .najoom-anchor-map.tsv
          git commit -m '[anchor-map] map target against current index' || exit 0
          git push
