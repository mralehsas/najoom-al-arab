name: Najoom Export Current Index

on:
  push:
    paths:
      - '.github/workflows/najoom-export-current-index.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload current index
        uses: actions/upload-artifact@v4
        with:
          name: najoom-current-index
          path: index.html
          if-no-files-found: error
          retention-days: 1
