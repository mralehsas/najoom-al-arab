name: Najoom Index Blocks

on:
  push:
    paths:
      - '.github/workflows/najoom-index-blocks.yml'

permissions:
  contents: write

jobs:
  blocks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate block fingerprints
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          data = Path('index.html').read_bytes()
          lines = data.splitlines(keepends=True)
          step = 100
          with Path('.najoom-index-blocks.tsv').open('w', encoding='utf-8', newline='\n') as f:
              f.write(f'FILE\t{len(data)}\t{len(lines)}\t{hashlib.sha256(data).hexdigest()}\n')
              for start in range(0, len(lines), step):
                  block = b''.join(lines[start:start+step])
                  f.write(f'{start+1}\t{min(start+step,len(lines))}\t{len(block)}\t{hashlib.sha256(block).hexdigest()}\n')
          PY
      - name: Commit block fingerprints
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .najoom-index-blocks.tsv
          git commit -m '[hash-blocks] snapshot current index blocks' || exit 0
          git push
