name: Najoom Index Manifest

on:
  push:
    paths:
      - '.github/workflows/najoom-index-manifest.yml'

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate exact line manifest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('index.html')
          data = p.read_bytes()
          lines = data.splitlines(keepends=True)
          out = Path('.najoom-index-lines.tsv')
          with out.open('w', encoding='utf-8', newline='\n') as f:
              f.write('FILE_SHA256\t' + hashlib.sha256(data).hexdigest() + '\n')
              for i, line in enumerate(lines, 1):
                  f.write(f'{i}\t{len(line)}\t{hashlib.sha256(line).hexdigest()}\n')
          print('bytes', len(data), 'lines', len(lines), 'sha256', hashlib.sha256(data).hexdigest())
          PY
      - name: Commit manifest
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .najoom-index-lines.tsv
          git commit -m '[hash-manifest] snapshot current index' || exit 0
          git push
